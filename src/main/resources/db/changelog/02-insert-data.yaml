      author: FedeMartinez
      changes:
        - insert:
            tableName: customer
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: first_name, value: 'Marcos'}
              - column: {name: last_name, value: 'Gutierrez'}
              - column: {name: address, value: 'la buena direccion 123'}
              - column: {name: city, value: 'CABA'}
        - insert:
            tableName: customer
            columns:
              - column: {name: id, valueNumeric: 2}
