  - changeSet:
      id: 7-insert-shippings
      author: FedeMartinez
      changes:
        - insert:
            tableName: shipping
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: customer_id, valueNumeric: 1}
              - column: {name: state, value: 'Entregado'}
              - column: {name: send_date, valueComputed: 'CURRENT_DATE - 5'}
              - column: {name: arrive_date, valueComputed: 'CURRENT_DATE'}
              - column: {name: priority, valueNumeric: 0}
              - column: {name: type, value: 'PACKAGE'}
        - insert:
            tableName: shipping
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: customer_id, valueNumeric: 2}
              - column: {name: state, value: 'En camino'}
              - column: {name: send_date, valueComputed: 'CURRENT_DATE - 5'}
              - column: {name: priority, valueNumeric: 2}
              - column: {name: type, value: 'PACKAGE'}
        - insert:
            tableName: shipping
            columns:
              - column: {name: id, valueNumeric: 3}
              - column: {name: customer_id, valueNumeric: 1}
              - column: {name: state, value: 'Inicial'}
              - column: {name: send_date, valueComputed: 'CURRENT_DATE'}
              - column: {name: priority, valueNumeric: 2}
              - column: {name: type, value: 'PACKAGE'}
        - insert:
            tableName: shipping
            columns:
              - column: {name: id, valueNumeric: 4}
              - column: {name: customer_id, valueNumeric: 3}
              - column: {name: state, value: 'Cancelado'}
              - column: {name: send_date, valueComputed: 'CURRENT_DATE - 4'}
              - column: {name: priority, valueNumeric: 2}
              - column: {name: type, value: 'PACKAGE'}

  - changeSet:
      id: 8-insert-shipping-items
      author: FedeMartinez
      changes:
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 1}}, {column: {name: shipping_id, valueNumeric: 1}}, {column: {name: product_id, valueNumeric: 1}}, {column: {name: product_count, valueNumeric: 5}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 2}}, {column: {name: shipping_id, valueNumeric: 1}}, {column: {name: product_id, valueNumeric: 2}}, {column: {name: product_count, valueNumeric: 2}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 3}}, {column: {name: shipping_id, valueNumeric: 1}}, {column: {name: product_id, valueNumeric: 3}}, {column: {name: product_count, valueNumeric: 1}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 4}}, {column: {name: shipping_id, valueNumeric: 2}}, {column: {name: product_id, valueNumeric: 4}}, {column: {name: product_count, valueNumeric: 6}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 5}}, {column: {name: shipping_id, valueNumeric: 2}}, {column: {name: product_id, valueNumeric: 5}}, {column: {name: product_count, valueNumeric: 2}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 6}}, {column: {name: shipping_id, valueNumeric: 2}}, {column: {name: product_id, valueNumeric: 6}}, {column: {name: product_count, valueNumeric: 2}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 7}}, {column: {name: shipping_id, valueNumeric: 3}}, {column: {name: product_id, valueNumeric: 4}}, {column: {name: product_count, valueNumeric: 1}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 8}}, {column: {name: shipping_id, valueNumeric: 3}}, {column: {name: product_id, valueNumeric: 5}}, {column: {name: product_count, valueNumeric: 2}}]}
        - insert: {tableName: shipping_item, columns: [{column: {name: id, valueNumeric: 9}}, {column: {name: shipping_id, valueNumeric: 4}}, {column: {name: product_id, valueNumeric: 3}}, {column: {name: product_count, valueNumeric: 1}}]}

  - changeSet:
      id: 9-alter-sequences
      author: FedeMartinez
      changes:
        - sql:
            sql: "SELECT setval('customer_id_seq', (SELECT MAX(id) FROM customer));"
        - sql:
            sql: "SELECT setval('product_id_seq', (SELECT MAX(id) FROM product));"
        - sql:
            sql: "SELECT setval('shipping_id_seq', (SELECT MAX(id) FROM shipping));"
        - sql:
            sql: "SELECT setval('shipping_item_id_seq', (SELECT MAX(id) FROM shipping_item));"